<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留答 · 整校夜游与定位随动预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c25;color:#eee8db;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer;color:inherit;background:#203641;border:1px solid #667675;border-radius:20px;padding:9px 13px}button:focus-visible,input:focus-visible{outline:2px solid #e1c58b;outline-offset:3px}.page{max-width:900px;margin:auto;padding:22px}.header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.header strong{font-weight:500;letter-spacing:.15em}.header small{color:#adb8b6;font-size:11px}.map{height:min(720px,calc(100svh - 180px));min-height:480px;background:#243b47;position:relative;overflow:hidden;border-radius:22px;touch-action:none;isolation:isolate}.tile{position:absolute;transform-origin:0 0;pointer-events:none}.label{position:absolute;transform:translate(-50%,-50%);padding:3px 5px;line-height:14px;color:#253c43;background:#e7d6b2;white-space:nowrap;pointer-events:none}.label.draft{color:#d0d4c8;background:#30494e}.marker{position:absolute;pointer-events:none}.user{position:absolute;width:18px;height:18px;background:#66b7eb;border:3px solid #f3f8fc;border-radius:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none}.ring{position:absolute;border:1px solid #7db3d766;background:#77b7e217;border-radius:50%;pointer-events:none}.top{position:absolute;inset:16px 16px auto;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:6;pointer-events:none}.place{background:#142a36df;padding:10px 13px;border-radius:18px;line-height:20px}.place small{color:#e1cea4;font-size:10px}.buttons{display:flex;gap:7px;pointer-events:auto}.buttons button{background:#142a36eb}.source{position:absolute;bottom:10px;right:12px;font-size:9px;color:#d1d7c8;text-shadow:0 1px #132e39;z-index:5}.bar{position:absolute;left:14px;bottom:12px;color:#e0d8bf;font-size:9px;pointer-events:none}.bar i{display:block;height:4px;border-bottom:1.5px solid;margin-bottom:3px}.walk{display:flex;align-items:center;gap:14px;margin-top:15px;color:#b7c3c0;font-size:12px}.walk input{flex:1;min-width:70px;accent-color:#e7d6b2}.note{margin-top:10px;color:#a5b2b2;font-size:10px}.gps{color:#e1cea4}@media(max-width:500px){.page{padding:13px}.map{height:calc(100svh - 153px)}.header small{font-size:10px}.top{inset:13px 12px auto}.buttons{gap:5px}.buttons button{padding:8px 11px;font-size:12px}.place{padding:8px 11px}.note{line-height:1.5}}
</style>
<div class="page"><header class="header"><strong>留答 · 贸大夜游</strong><small>与小程序共用地图相机</small></header><main class="map" id="map"><img id="tile" class="tile" src="../../../miniprogram/assets/campus/uibe-night.jpg" alt="整校艺术底图"><div id="labels"></div><div id="ring" class="ring" hidden></div><div id="pins"></div><div id="user" class="user" hidden></div><div class="top"><div class="place">整校地图<br><small id="mode">概览 · 尚未现场校准</small></div><div class="buttons"><button id="follow">模拟 GPS</button><button id="overview">整校</button><button id="zoom" aria-label="放大地图">＋</button></div></div><div class="bar"><i id="scale"></i><span id="scale-text"></span></div><div class="source">© OpenStreetMap contributors · ODbL</div></main><div class="walk"><span>模拟步行</span><input id="walk" type="range" min="0" max="100" value="40" aria-label="模拟在惠中大道步行"><span class="gps" id="gps">未跟随</span></div><div class="note">这里使用公开道路上的模拟位置；手机真 GPS 已接入小程序，仍需真机与实地核验。</div></div>
<script>
const definitions={},cache={};
/* MODULES */
function require(id){if(cache[id])return cache[id].exports;const m={exports:{}};cache[id]=m;definitions[id](m,m.exports,require);return m.exports}
const campus=require('./campus-map'),geo=require('./geo'),meta=campus.metadata,route=/* ROUTE */[];
const map=document.getElementById('map'),tile=document.getElementById('tile'),labels=document.getElementById('labels'),user=document.getElementById('user'),ring=document.getElementById('ring');
tile.style.width=(meta.bounds.right-meta.bounds.left)+'px';tile.style.height=(meta.bounds.bottom-meta.bounds.top)+'px';
let renderer,following=false,scale=17,position=null,down=false,moved=false;
function sample(value){const start=route[0],end=route[route.length-1],t=.2+value/100*.6;return Object.assign(geo.offset(meta.origin,start[0]+(end[0]-start[0])*t,-(start[1]+(end[1]-start[1])*t)),{source:'gps',coordinateSystem:'gcj02',accuracy:8,timestamp:Date.now()})}
function sync(){renderer.update({position,following,mapScale:scale,groups:[]});document.getElementById('mode').textContent=following?'模拟位置随动 · 尚未现场校准':'概览 / 自由浏览 · 尚未现场校准';document.getElementById('gps').textContent=following?'跟随中':'未跟随'}
function init(){if(renderer)renderer.destroy();renderer=campus.create(map.clientWidth,map.clientHeight,{frame:f=>{tile.style.transform=f.transform;labels.replaceChildren(...f.labels.map(l=>{const el=document.createElement('div');el.className='label'+(l.draft?' draft':'');el.style.cssText='left:'+l.x+'px;top:'+l.y+'px;font-size:'+l.font+'px';el.textContent=l.name;return el}));user.hidden=!f.user;ring.hidden=!f.user||!f.user.radius;if(f.user){user.style.left=f.user.x+'px';user.style.top=f.user.y+'px';ring.style.cssText='left:'+(f.user.x-f.user.radius)+'px;top:'+(f.user.y-f.user.radius)+'px;width:'+f.user.radius*2+'px;height:'+f.user.radius*2+'px'}document.getElementById('scale').style.width=f.scaleWidth+'px';document.getElementById('scale-text').textContent=f.scaleText},pan:()=>{following=false;document.getElementById('gps').textContent='自由浏览'},camera:c=>{scale=c.scale}});sync()}
new ResizeObserver(init).observe(map);
document.getElementById('follow').onclick=()=>{position=sample(Number(document.getElementById('walk').value));following=true;scale=18;sync();renderer.goTo(position,18)};
document.getElementById('overview').onclick=()=>{following=false;sync();renderer.overview()};document.getElementById('zoom').onclick=()=>renderer.zoom(1);
document.getElementById('walk').oninput=e=>{position=sample(Number(e.target.value));sync()};
map.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=true;moved=false;map.setPointerCapture(e.pointerId);const r=map.getBoundingClientRect();renderer.touchStart({touches:[{x:e.clientX-r.left,y:e.clientY-r.top}]})});
map.addEventListener('pointermove',e=>{if(!down)return;moved=true;const r=map.getBoundingClientRect();renderer.touchMove({touches:[{x:e.clientX-r.left,y:e.clientY-r.top}]})});
map.addEventListener('pointerup',()=>{if(down){renderer.touchEnd({touches:[]});down=false;sync()}});map.addEventListener('pointercancel',()=>{renderer.touchCancel({touches:[]});down=false});
</script></html>
