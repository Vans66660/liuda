<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>留答 · 对话页布局</title><style>body{margin:0;padding:20px;background:#eceeea;color:#24262b;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}h1{font-size:21px;margin:0 0 6px}p{margin:0 0 14px;color:#696d75;font-size:12px}main{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}section{display:grid;gap:8px}iframe{border:0;border-radius:20px;background:#08090b;box-shadow:0 6px 32px #0001}select{padding:6px;border-radius:8px;border:1px solid #bbb}</style><h1>留答 · 对话页</h1><p>使用生产 WXML/WXSS 的布局预览 · 内容与权限均为模拟数据，不调用云端接口。</p><main><section><label>390px · <select id="state"><option value="away">已参与 · 离场续聊</option><option value="onsite">已到场 · 首次接话</option><option value="distant">未到场 · 预览</option><option value="typed">填写后</option><option value="sending">发送中</option><option value="liking">点赞中</option><option value="long">长标题及多条回复</option><option value="expired">内容待同步</option><option value="missing">已删除</option><option value="error">网络错误</option><option value="loading">加载中</option></select></label><iframe id="primary" title="390px 对话布局" width="390" height="610" src="away.html"></iframe></section><section><label>320px · 现场首次接话</label><iframe title="320px 现场接话" width="320" height="610" src="onsite.html"></iframe></section><section><label>320px · 未到场预览</label><iframe title="320px 预览" width="320" height="610" src="distant.html"></iframe></section></main><script>document.querySelector('select').onchange=e=>document.querySelector('#primary').src=e.target.value+'.html'</script></html>
