<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{margin:0;padding:24px;background:#eceeea;color:#24262b;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}h1{font-size:22px;margin:0 0 8px}p{color:#696d75}main{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}section{display:grid;gap:12px}iframe{border:0;border-radius:20px;background:#08090b;box-shadow:0 6px 32px #0001}select{padding:8px;border-radius:8px;border:1px solid #bbb}</style><h1>留答 · 现场留话</h1><p>布局预览 · 使用生产 WXML/WXSS 与模拟数据，不调用定位、相机及云接口。照片状态以品牌图代替现场照。</p><main><section><label>390 px · <select id="state"><option value="empty">空白</option><option value="filled">填写后</option><option value="weak">定位异常</option><option value="long">长地点名称</option><option value="photo">已有照片</option><option value="busy">提交中</option><option value="error">提交失败</option><option value="success">发布成功</option></select></label><iframe id="primary" title="390px 页面布局" width="390" height="830" src="empty.html"></iframe></section><section><label>320 px · 定位异常</label><iframe title="320px 定位异常" width="320" height="830" src="weak.html"></iframe></section><section><label>320 px · 发布成功</label><iframe title="320px 成功状态" width="320" height="700" src="success.html"></iframe></section></main><script>document.querySelector('select').onchange=e=>document.querySelector('#primary').src=e.target.value+'.html'</script></html>
